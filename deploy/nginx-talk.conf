# An example nginx site for Talk. Please replace talk.example.com with your own address, put the paths of your own certificate in place, and copy the file to
# /etc/nginx/sites-available/, then link it into sites-enabled/ and reload nginx.
#
# The telephony provider needs an https address for its callbacks, and the four simulated provider systems are reached on the same public address, so this one
# site carries everything: the website, the call callbacks and the provider endpoints under /synthetic.

server {
    listen 80;
    server_name talk.example.com;
    # Everything on the plain address is sent to the https address.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name talk.example.com;

    ssl_certificate     /etc/letsencrypt/live/talk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talk.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Talk reads the last address in this header as the visitor's address, for its hourly limits, so the header must be built by this web server and never copied
        # from the visitor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A reply that waits for the language model and the voice can take several seconds, so the connection is given time.
        proxy_read_timeout 60s;
    }
}
