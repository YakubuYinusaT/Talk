[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-health"
version = "0.1.0"
description = "Talk: healthcare by phone call in Lagos, with Meta Muse Voice Transcribe and Muse Spark. Built by Connected Intelligence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Connected Intelligence" }]
license = { file = "LICENSE" }
# These are the packages that the code imports. A PostgreSQL driver, Redis and the Piper voice are optional and are listed under optional-dependencies.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# For DATABASE_URL=postgresql+psycopg://... instead of the default SQLite file.
postgres = ["psycopg[binary]>=3.1"]
# For REDIS_URL, which keeps the working memory of calls in Redis instead of inside the process.
redis = ["redis>=5"]
# For PIPER_MODEL, the voice that runs on the server itself (deploy/setup_voice.sh installs it for you).
voice = ["piper-tts"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import their shared helpers as tests.support, so the project folder must be on the import path.
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["sofa*", "mocks*"]

[tool.setuptools.package-data]
sofa = [
  "web/templates/*.html",
  "web/templates/desk/*.html",
  "web/templates/onboard/*.html",
  "web/static/*",
  "web/static/fonts/*",
]
